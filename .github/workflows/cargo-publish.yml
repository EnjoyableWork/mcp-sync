name: Publish Cargo package with trusted publishing

# MCP-039 keeps registry authority in this dedicated protected workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Cargo version without the v prefix
        required: true
        type: string
      tag:
        description: Existing immutable GitHub Release tag
        required: true
        type: string
      release_kind:
        description: Immutable GitHub Release producer
        required: true
        type: choice
        options:
          - source-linux
          - funded
      mode:
        description: Exchange and revoke authorization only, or publish the requested version
        required: true
        default: authorization-only
        type: choice
        options:
          - authorization-only
          - publish
  deployment:

permissions: {}

concurrency:
  group: cargo-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Cargo publication request before protected access
    if: >-
      github.repository == 'EnjoyableWork/mcp-sync' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.deployment.task == 'mcp-sync:cargo-publish-authorization')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      release_kind: ${{ steps.request.outputs.release_kind }}
      mode: ${{ steps.request.outputs.mode }}

    steps:
      - name: Check out the validator from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Validate the repository, event, exact tag, release kind, and mode
        id: request
        env:
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_EVENT: ${{ github.event_name }}
          REQUEST_REF: ${{ github.ref }}
          REQUEST_REF_TYPE: ${{ github.ref_type }}
          REQUEST_SHA: ${{ github.sha }}
          REQUEST_VERSION: ${{ inputs.version || github.event.deployment.payload.version }}
          REQUEST_TAG: ${{ inputs.tag || github.event.deployment.payload.tag }}
          REQUEST_RELEASE_KIND: ${{ inputs.release_kind || github.event.deployment.payload.release_kind }}
          REQUEST_MODE: ${{ inputs.mode || github.event.deployment.payload.mode }}
          DEPLOYMENT_REF: ${{ github.event.deployment.ref }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_TASK: ${{ github.event.deployment.task }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_CONTRACT: ${{ github.event.deployment.payload.contract }}
        run: scripts/validate-cargo-publish-request.sh

  publish:
    name: Verify immutable bytes and use short-lived crates.io authorization
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: release
      deployment: false
    permissions:
      attestations: read
      contents: read
      id-token: write
    outputs:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
      mode: ${{ needs.validate.outputs.mode }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_KIND: ${{ needs.validate.outputs.release_kind }}
      PUBLICATION_MODE: ${{ needs.validate.outputs.mode }}

    steps:
      - name: Check out the exact protected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Verify immutable release, attested package, and deterministic local bytes
        run: |
          set -euo pipefail

          if [[ "$(git cat-file -t "$RELEASE_TAG")" != tag ]]; then
            echo "Cargo publication requires an intentional annotated release tag" >&2
            exit 1
          fi
          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$release_commit" != "$GITHUB_SHA" ]] ||
            [[ "$(git rev-parse HEAD)" != "$release_commit" ]]; then
            echo "Cargo publication source does not match the triggering tag commit" >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "Cargo package version does not match the publication request" >&2
            exit 1
          fi

          release_state="$RUNNER_TEMP/mcp-sync-cargo-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -H 'X-GitHub-Api-Version: 2026-03-10' >"$release_state"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and
             .prerelease == false and .immutable == true' \
            "$release_state" >/dev/null

          release_assets="$RUNNER_TEMP/mcp-sync-cargo-release-assets"
          mkdir -p "$release_assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_assets"
          case "$RELEASE_KIND" in
            source-linux)
              scripts/verify-published-source-linux-release.sh \
                "$release_assets" \
                "$RELEASE_VERSION"
              signer_workflow="$GITHUB_REPOSITORY/.github/workflows/source-linux-release.yml"
              ;;
            funded)
              scripts/verify-published-release.sh \
                "$release_assets" \
                "$RELEASE_VERSION"
              signer_workflow="$GITHUB_REPOSITORY/.github/workflows/release.yml"
              ;;
            *)
              echo "validated Cargo release kind was lost" >&2
              exit 1
              ;;
          esac
          gh release verify "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --format json >/dev/null

          release_package="$release_assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          gh attestation verify "$release_package" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-ref "refs/tags/$RELEASE_TAG" \
            --source-digest "$release_commit" \
            --format json >/dev/null

          cargo package --locked
          local_package="target/package/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          first_package="$RUNNER_TEMP/enjoyable-mcp-sync-first.crate"
          install -m 0644 "$local_package" "$first_package"
          cargo package --locked
          cmp --silent "$first_package" "$local_package"
          cmp --silent "$release_package" "$local_package"

          registry_state="$RUNNER_TEMP/enjoyable-mcp-sync-registry.json"
          registry_status="$(
            curl --silent --show-error --location --retry 5 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$registry_state" \
              --write-out '%{http_code}' \
              --header 'User-Agent: mcp-sync-cargo-publisher/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
              'https://crates.io/api/v1/crates/enjoyable-mcp-sync'
          )"
          if [[ "$registry_status" != 200 ]]; then
            echo "crates.io package identity could not be verified" >&2
            exit 1
          fi
          jq -e \
            '.crate.repository == "https://github.com/EnjoyableWork/mcp-sync"' \
            "$registry_state" >/dev/null
          if [[ "$PUBLICATION_MODE" == publish ]]; then
            jq -e '.crate.trustpub_only == true' "$registry_state" >/dev/null
            if jq -e --arg version "$RELEASE_VERSION" \
              'any(.versions[]; .num == $version)' \
              "$registry_state" >/dev/null; then
              echo "requested Cargo version already exists and cannot be republished" >&2
              exit 1
            fi
            cargo publish --dry-run --locked --registry crates-io
          else
            jq -e --arg version "$RELEASE_VERSION" \
              'any(.versions[]; .num == $version and .yanked == false)' \
              "$registry_state" >/dev/null
          fi

      - name: Obtain short-lived crates.io authorization through OIDC
        id: crates_io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Require the MCP-039 rehearsal to create no Cargo version
        if: >-
          github.event_name == 'deployment' &&
          needs.validate.outputs.mode == 'authorization-only'
        run: |
          set -euo pipefail
          rehearsal_state="$RUNNER_TEMP/enjoyable-mcp-sync-rehearsal.json"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$rehearsal_state" \
            --header 'User-Agent: mcp-sync-cargo-publisher/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
            'https://crates.io/api/v1/crates/enjoyable-mcp-sync'
          jq -e '
            .crate.repository == "https://github.com/EnjoyableWork/mcp-sync" and
            ([.versions[].num] | sort) == ["0.1.0"] and
            any(.versions[]; .num == "0.1.0" and .yanked == false)
          ' "$rehearsal_state" >/dev/null

      - name: Record successful authorization-only rehearsal
        if: needs.validate.outputs.mode == 'authorization-only'
        run: |
          {
            printf '### Cargo trusted-publishing authorization\n\n'
            printf -- '- Mode: authorization only; no package was published.\n'
            printf -- '- Version evidence: %s from immutable tag %s.\n' \
              "$RELEASE_VERSION" \
              "$RELEASE_TAG"
            printf -- '- Release producer: %s.\n' "$RELEASE_KIND"
            printf -- '- The temporary credential is revoked by the authentication action.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Publish the exact verified package
        if: needs.validate.outputs.mode == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io.outputs.token }}
        run: cargo publish --locked --registry crates-io

      - name: Require byte-identical registry publication
        if: needs.validate.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          registry_state="$RUNNER_TEMP/enjoyable-mcp-sync-published.json"
          registry_package="$RUNNER_TEMP/enjoyable-mcp-sync-published.crate"
          release_package="$RUNNER_TEMP/mcp-sync-cargo-release-assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          published=false
          for _ in {1..30}; do
            if curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$registry_state" \
              --header 'User-Agent: mcp-sync-cargo-publisher/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
              'https://crates.io/api/v1/crates/enjoyable-mcp-sync' &&
              jq -e --arg version "$RELEASE_VERSION" \
                '.crate.repository == "https://github.com/EnjoyableWork/mcp-sync" and
                 any(.versions[]; .num == $version and .yanked == false)' \
                "$registry_state" >/dev/null &&
              curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --output "$registry_package" \
                --header 'User-Agent: mcp-sync-cargo-publisher/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
                "https://crates.io/api/v1/crates/enjoyable-mcp-sync/$RELEASE_VERSION/download" &&
              cmp --silent "$release_package" "$registry_package"; then
              published=true
              break
            fi
            sleep 10
          done
          if [[ "$published" != true ]]; then
            echo "published Cargo package did not converge to the verified release bytes" >&2
            exit 1
          fi

  cargo-unix:
    name: Cargo ${{ matrix.name }} — install and restore
    needs: publish
    if: needs.publish.outputs.mode == 'publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - name: GNU/Linux ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - name: GNU/Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
    env:
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out installed-channel smoke sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publish.outputs.tag }}

      - name: Install the exact Cargo version and exercise restore
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"
          install_root="$RUNNER_TEMP/mcp-sync-cargo-$RUST_TARGET"
          cargo install enjoyable-mcp-sync \
            --registry crates-io \
            --version "=$RELEASE_VERSION" \
            --locked \
            --root "$install_root"
          scripts/smoke-installed.sh "$install_root/bin/mcp-sync" "$RELEASE_VERSION"

  cargo-windows:
    name: Cargo Windows ${{ matrix.architecture }} — install and restore
    needs: publish
    if: needs.publish.outputs.mode == 'publish'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - architecture: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
    env:
      RELEASE_VERSION: ${{ needs.publish.outputs.version }}
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out installed-channel smoke sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.publish.outputs.tag }}

      - name: Install the exact Cargo version and exercise restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:RUST_TARGET) {
            throw 'Cargo installation smoke is not running on the expected native Windows host.'
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "mcp-sync-cargo-$env:RUST_TARGET"
          cargo install enjoyable-mcp-sync `
            --registry crates-io `
            --version "=$env:RELEASE_VERSION" `
            --locked `
            --root $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the exact Cargo package.'
          }
          & scripts/smoke-installed.ps1 `
            -Executable (Join-Path $installRoot 'bin/mcp-sync.exe') `
            -ExpectedVersion $env:RELEASE_VERSION
