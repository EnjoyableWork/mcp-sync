name: Verify funded signed release channels

on:
  workflow_dispatch:
    inputs:
      version:
        description: Funded signed stable version without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: release-channels-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Verify immutable release and downstream metadata
    if: github.repository == 'EnjoyableWork/mcp-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Validate the stable version input
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release version must be a stable semantic version" >&2
            exit 1
          fi
          if [[ "$RELEASE_VERSION" == 0.1.0 ]]; then
            echo "v0.1.0 belongs to the zero-cost market channel verifier" >&2
            exit 1
          fi
          printf 'value=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: v${{ steps.version.outputs.value }}

      - name: Verify the tag, release, attestations, registry, and channel metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_tag="v$RELEASE_VERSION"

          if [[ "$(git cat-file -t "$release_tag")" != tag ]]; then
            echo "published stable release must use an annotated tag" >&2
            exit 1
          fi
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          if [[ "$package_version" != "$RELEASE_VERSION" ]]; then
            echo "release tag and Cargo package version differ" >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/mcp-sync-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
            -H 'X-GitHub-Api-Version: 2026-03-10' > "$release_json"
          jq -e \
            --arg tag "$release_tag" \
            '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' \
            "$release_json" >/dev/null

          release_assets="$RUNNER_TEMP/mcp-sync-release-assets"
          mkdir -p "$release_assets"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$release_assets"
          scripts/verify-published-release.sh "$release_assets" "$RELEASE_VERSION"
          gh release verify "$release_tag" --repo "$GITHUB_REPOSITORY"
          release_commit="$(git rev-parse "$release_tag^{commit}")"
          for release_asset in "$release_assets"/*; do
            gh attestation verify "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$release_tag" \
              --source-digest "$release_commit" \
              --format json >/dev/null
          done

          registry_response="$RUNNER_TEMP/enjoyable-mcp-sync-crates.json"
          registry_status="$(
            curl --silent --show-error --location --retry 5 \
              --output "$registry_response" \
              --write-out '%{http_code}' \
              --header 'User-Agent: mcp-sync-channel-verifier/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
              'https://crates.io/api/v1/crates/enjoyable-mcp-sync'
          )"
          if [[ "$registry_status" != 200 ]]; then
            echo "published Cargo package identity could not be verified" >&2
            exit 1
          fi
          jq -e \
            --arg version "$RELEASE_VERSION" \
            '.crate.repository == "https://github.com/EnjoyableWork/mcp-sync" and
             any(.versions[]; .num == $version and .yanked == false)' \
            "$registry_response" >/dev/null

          generated_channels="$RUNNER_TEMP/mcp-sync-generated-channels"
          scripts/generate-release-channels.sh \
            "$release_assets" \
            "$RELEASE_VERSION" \
            "$generated_channels"

          published_formula="$RUNNER_TEMP/mcp-sync.rb"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$published_formula" \
            'https://raw.githubusercontent.com/EnjoyableWork/homebrew-tap/main/Formula/mcp-sync.rb'
          cmp "$generated_channels/homebrew/Formula/mcp-sync.rb" "$published_formula"

          winget_base="https://raw.githubusercontent.com/microsoft/winget-pkgs/master/manifests/e/EnjoyableWork/mcp-sync/$RELEASE_VERSION"
          winget_names=(
            EnjoyableWork.mcp-sync.yaml
            EnjoyableWork.mcp-sync.locale.en-US.yaml
            EnjoyableWork.mcp-sync.installer.yaml
          )
          for winget_name in "${winget_names[@]}"; do
            published_manifest="$RUNNER_TEMP/$winget_name"
            curl --fail --silent --show-error --location --retry 5 \
              --output "$published_manifest" \
              "$winget_base/$winget_name"
            cmp \
              "$generated_channels/winget/manifests/e/EnjoyableWork/mcp-sync/$RELEASE_VERSION/$winget_name" \
              "$published_manifest"
          done

  github-unix:
    name: GitHub ${{ matrix.name }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            verify_macos_trust: true
          - name: macOS x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            verify_macos_trust: true
          - name: GNU/Linux ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            verify_macos_trust: false
          - name: GNU/Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            verify_macos_trust: false
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Download, verify, and smoke-test the native archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_MACOS_TRUST: ${{ matrix.verify_macos_trust }}
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"

          release_tag="v$RELEASE_VERSION"
          archive="mcp-sync-$release_tag-$RUST_TARGET.tar.gz"
          download_root="$RUNNER_TEMP/mcp-sync-github-$RUST_TARGET"
          mkdir -p "$download_root"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$download_root"

          matching_lines="$(awk -v asset="$archive" '$2 == asset { print }' "$download_root/SHA256SUMS")"
          if [[ "$(printf '%s\n' "$matching_lines" | awk 'NF { count++ } END { print count + 0 }')" != 1 ]]; then
            echo "release checksum is missing or ambiguous" >&2
            exit 1
          fi
          (
            cd "$download_root"
            printf '%s\n' "$matching_lines" | sha256sum --check -
          )
          gh attestation verify "$download_root/$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$release_tag" \
            --source-digest "$(git rev-parse HEAD)" \
            --format json >/dev/null

          if [[ "$VERIFY_MACOS_TRUST" == true ]]; then
            trust_root="$(mktemp -d "$RUNNER_TEMP/mcp-sync-macos-trust.XXXXXX")"
            trap 'rm -rf -- "$trust_root"' EXIT
            tar -xzf "$download_root/$archive" -C "$trust_root" mcp-sync
            scripts/verify-macos-release-trust.sh "$trust_root/mcp-sync"
          fi

          scripts/smoke-archive.sh "$download_root/$archive" "$RELEASE_VERSION"

  github-windows:
    name: GitHub Windows ${{ matrix.architecture }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - architecture: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Download, verify, and smoke-test the native archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:RUST_TARGET) {
              throw 'GitHub archive smoke is not running on the expected native Windows host.'
          }

          $releaseTag = "v$env:RELEASE_VERSION"
          $archive = "mcp-sync-$releaseTag-$env:RUST_TARGET.zip"
          $downloadRoot = Join-Path $env:RUNNER_TEMP "mcp-sync-github-$env:RUST_TARGET"
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null
          gh release download $releaseTag `
              --repo $env:GITHUB_REPOSITORY `
              --pattern $archive `
              --pattern SHA256SUMS `
              --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not download the published Windows release archive.'
          }

          $manifestEntries = @(
              Get-Content -LiteralPath (Join-Path $downloadRoot 'SHA256SUMS') | ForEach-Object {
                  if ($_ -cmatch '^([0-9A-Fa-f]{64})  ([^/\\]+)$') {
                      [pscustomobject]@{ Hash = $Matches[1]; Name = $Matches[2] }
                  }
              }
          )
          $matchingEntries = @($manifestEntries | Where-Object Name -CEQ $archive)
          if ($matchingEntries.Count -ne 1) {
              throw 'Release checksum is missing or ambiguous.'
          }
          $archivePath = Join-Path $downloadRoot $archive
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash
          if ($actualHash -cne $matchingEntries[0].Hash.ToUpperInvariant()) {
              throw 'Published Windows release archive checksum differs.'
          }
          $sourceDigest = (git rev-parse HEAD).Trim()
          gh attestation verify $archivePath `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" `
              --source-ref "refs/tags/$releaseTag" `
              --source-digest $sourceDigest `
              --format json | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw 'Published Windows release archive attestation failed.'
          }

          $trustRoot = Join-Path $env:RUNNER_TEMP ("mcp-sync-windows-trust-" + [guid]::NewGuid().ToString('N'))
          try {
              Expand-Archive -LiteralPath $archivePath -DestinationPath $trustRoot
              & scripts/verify-windows-release-trust.ps1 `
                  -Executable (Join-Path $trustRoot 'mcp-sync.exe')
              & scripts/smoke-archive.ps1 `
                  -Archive $archivePath `
                  -ExpectedVersion $env:RELEASE_VERSION
          }
          finally {
              if (Test-Path -LiteralPath $trustRoot) {
                  Remove-Item -LiteralPath $trustRoot -Recurse -Force
              }
          }

  cargo-unix:
    name: Cargo ${{ matrix.name }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - name: GNU/Linux ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - name: GNU/Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Install the exact Cargo package and exercise restore
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"
          install_root="$RUNNER_TEMP/mcp-sync-cargo-$RUST_TARGET"
          cargo install enjoyable-mcp-sync \
            --version "=$RELEASE_VERSION" \
            --locked \
            --root "$install_root"
          scripts/smoke-installed.sh "$install_root/bin/mcp-sync" "$RELEASE_VERSION"

  cargo-windows:
    name: Cargo Windows ${{ matrix.architecture }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - architecture: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Install the exact Cargo package and exercise restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:RUST_TARGET) {
              throw 'Cargo smoke is not running on the expected native Windows host.'
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "mcp-sync-cargo-$env:RUST_TARGET"
          cargo install enjoyable-mcp-sync `
              --version "=$env:RELEASE_VERSION" `
              --locked `
              --root $installRoot
          if ($LASTEXITCODE -ne 0) {
              throw 'Cargo could not install the exact published package.'
          }
          & scripts/smoke-installed.ps1 `
              -Executable (Join-Path $installRoot 'bin/mcp-sync.exe') `
              -ExpectedVersion $env:RELEASE_VERSION

  homebrew:
    name: Homebrew ${{ matrix.name }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            verify_macos_trust: true
          - name: macOS x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            verify_macos_trust: true
          - name: GNU/Linux ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            verify_macos_trust: false
          - name: GNU/Linux x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            verify_macos_trust: false
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Set up current stable Homebrew
        uses: Homebrew/actions/setup-homebrew@fd832223f9f99ebf0244dd20658680e5d4aca049 # 2026.08.03.2

      - name: Install the exact formula and exercise restore
        env:
          VERIFY_MACOS_TRUST: ${{ matrix.verify_macos_trust }}
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"
          brew install EnjoyableWork/tap/mcp-sync
          brew audit --strict --online EnjoyableWork/tap/mcp-sync
          brew test EnjoyableWork/tap/mcp-sync
          formula_executable="$(brew --prefix EnjoyableWork/tap/mcp-sync)/bin/mcp-sync"
          if [[ "$VERIFY_MACOS_TRUST" == true ]]; then
            scripts/verify-macos-release-trust.sh "$formula_executable"
          fi
          scripts/smoke-installed.sh "$formula_executable" "$RELEASE_VERSION"

  winget:
    name: WinGet Windows ${{ matrix.architecture }} — install and restore
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
            os_architecture: Arm64
          - architecture: x64
            runner: windows-2025
            os_architecture: X64
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.validate.outputs.version }}

      - name: Install the exact public WinGet package and exercise restore
        env:
          EXPECTED_OS_ARCHITECTURE: ${{ matrix.os_architecture }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $actualArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actualArchitecture -cne $env:EXPECTED_OS_ARCHITECTURE) {
              throw 'WinGet smoke is not running on the expected native Windows architecture.'
          }

          $wingetCommand = Get-Command winget -ErrorAction SilentlyContinue
          if ($null -eq $wingetCommand) {
              Install-PackageProvider -Name NuGet -Force | Out-Null
              Install-Module `
                  -Name Microsoft.WinGet.Client `
                  -Force `
                  -Repository PSGallery `
                  -Scope CurrentUser | Out-Null
              Import-Module Microsoft.WinGet.Client
              Repair-WinGetPackageManager -Force -Latest
              $wingetCommand = Get-Command winget -ErrorAction SilentlyContinue
          }
          if ($null -eq $wingetCommand) {
              throw 'WinGet is unavailable after the supported bootstrap flow.'
          }
          $winget = $wingetCommand.Source

          & $winget source update `
              --name winget `
              --accept-source-agreements `
              --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
              throw 'WinGet could not update the public source.'
          }
          & $winget show `
              --id EnjoyableWork.mcp-sync `
              --version $env:RELEASE_VERSION `
              --exact `
              --source winget `
              --accept-source-agreements `
              --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
              throw 'The exact mcp-sync version is unavailable from the public WinGet source.'
          }
          & $winget install `
              --id EnjoyableWork.mcp-sync `
              --version $env:RELEASE_VERSION `
              --exact `
              --source winget `
              --scope user `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
              throw 'WinGet could not install the exact public mcp-sync version.'
          }

          $portableExecutable = Join-Path $env:LOCALAPPDATA 'Microsoft/WinGet/Links/mcp-sync.exe'
          if (-not (Test-Path -LiteralPath $portableExecutable -PathType Leaf)) {
              throw 'WinGet did not create the mcp-sync portable command alias.'
          }
          & scripts/verify-windows-release-trust.ps1 -Executable $portableExecutable
          & scripts/smoke-installed.ps1 `
              -Executable $portableExecutable `
              -ExpectedVersion $env:RELEASE_VERSION
