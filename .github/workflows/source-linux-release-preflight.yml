name: Source and GNU/Linux release preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-linux-release-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Deterministic Cargo package and source formula
    if: github.repository == 'EnjoyableWork/mcp-sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the public stable-tag ruleset without credentials
        run: scripts/verify-public-stable-tag-ruleset.sh "$GITHUB_REPOSITORY"

      - name: Read the stable package version
        id: version
        run: |
          set -euo pipefail
          release_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"

      - name: Prove deterministic Cargo and Homebrew generation
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo package --locked
          package="target/package/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          first_hash="$(sha256sum "$package" | awk '{ print $1 }')"
          cargo package --locked
          second_hash="$(sha256sum "$package" | awk '{ print $1 }')"
          test "$first_hash" = "$second_hash"

          scripts/generate-source-linux-release-channels.sh \
            "$package" \
            "$RELEASE_VERSION" \
            generated-source-linux-channels
          scripts/generate-source-linux-release-channels.sh \
            "$package" \
            "$RELEASE_VERSION" \
            generated-source-linux-channels-second
          diff -ru generated-source-linux-channels generated-source-linux-channels-second

          mkdir -p source-linux-source-assets
          install -m 0644 \
            "generated-source-linux-channels/cargo/enjoyable-mcp-sync-$RELEASE_VERSION.crate" \
            source-linux-source-assets/
          install -m 0644 \
            generated-source-linux-channels/homebrew/Formula/mcp-sync.rb \
            source-linux-source-assets/

      - name: Retain the source outputs briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-linux-preflight-source
          path: source-linux-source-assets/*
          if-no-files-found: error
          retention-days: 1

  unix:
    name: ${{ matrix.name }} — Cargo, Homebrew, and represented artifacts
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 source install
            runner: macos-15
            rust_target: aarch64-apple-darwin
            publish_linux: false
          - name: macOS x64 source install
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            publish_linux: false
          - name: GNU/Linux ARM64 source and archive
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            publish_linux: true
          - name: GNU/Linux x64 source and archive
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            publish_linux: true
    env:
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact source outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-linux-preflight-source
          path: source-linux-source-assets

      - name: Verify the native Rust host and package version
        id: version
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"
          release_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          printf 'version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"

      - name: Install the exact Cargo package and exercise restore
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/source-linux-source-assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          package_root="$RUNNER_TEMP/mcp-sync-cargo-package"
          install_root="$RUNNER_TEMP/mcp-sync-cargo-install"
          mkdir -p "$package_root"
          tar -xzf "$package" -C "$package_root"
          cargo install \
            --path "$package_root/enjoyable-mcp-sync-$RELEASE_VERSION" \
            --locked \
            --root "$install_root"
          scripts/smoke-installed.sh "$install_root/bin/mcp-sync" "$RELEASE_VERSION"

      - name: Set up current stable Homebrew
        uses: Homebrew/actions/setup-homebrew@c8707045ccae42888fe98e86f2ee8938bc7cc193 # 2026.08.10.1

      - name: Install the exact source formula and exercise restore
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tap_name=EnjoyableWork/source-linux-preflight
          formula_name="$tap_name/mcp-sync"
          brew tap-new --no-git "$tap_name"
          tap_root="$(brew --repository "$tap_name")"
          mkdir -p "$tap_root/Formula"
          install -m 0644 source-linux-source-assets/mcp-sync.rb "$tap_root/Formula/mcp-sync.rb"

          package="$GITHUB_WORKSPACE/source-linux-source-assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          cache_path="$(brew --cache --build-from-source "$formula_name")"
          mkdir -p "$(dirname "$cache_path")"
          install -m 0644 "$package" "$cache_path"

          brew style "$formula_name"
          brew audit --strict "$formula_name"
          brew install --build-from-source "$formula_name"
          brew test "$formula_name"
          formula_executable="$(brew --prefix "$formula_name")/bin/mcp-sync"
          scripts/smoke-installed.sh "$formula_executable" "$RELEASE_VERSION"

      - name: Build the represented native GNU/Linux executable
        if: matrix.publish_linux
        run: cargo build --release --locked

      - name: Package and smoke-test the represented GNU/Linux archive
        if: matrix.publish_linux
        id: package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive_path="$(
            scripts/package-release.sh \
              "$RELEASE_VERSION" \
              "$RUST_TARGET" \
              target/release/mcp-sync \
              release-assets
          )"
          scripts/smoke-archive.sh "$archive_path" "$RELEASE_VERSION"
          printf 'archive=%s\n' "$(basename "$archive_path")" >>"$GITHUB_OUTPUT"

      - name: Generate the represented target SPDX SBOM
        if: matrix.publish_linux
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: release-assets/${{ steps.package.outputs.archive }}
          format: spdx-json
          output-file: release-assets/mcp-sync-v${{ steps.version.outputs.version }}-${{ matrix.rust_target }}.spdx.json
          syft-version: v1.50.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Validate the represented target SPDX SBOM
        if: matrix.publish_linux
        env:
          SBOM_PATH: release-assets/mcp-sync-v${{ steps.version.outputs.version }}-${{ matrix.rust_target }}.spdx.json
        run: |
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.documentNamespace | type == "string") and
            (.packages | type == "array" and length > 0)
          ' "$SBOM_PATH" >/dev/null

      - name: Retain the represented GNU/Linux payload briefly
        if: matrix.publish_linux
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-linux-preflight-${{ matrix.rust_target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows ${{ matrix.architecture }} — Cargo source install and restore
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
          - architecture: x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
    env:
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the exact source outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-linux-preflight-source
          path: source-linux-source-assets

      - name: Install the exact Cargo package and exercise restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:RUST_TARGET) {
            throw 'Cargo source smoke is not running on the expected native Windows host.'
          }
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read Cargo metadata.'
          }
          $releaseVersion = ($metadata.packages | Where-Object name -eq 'enjoyable-mcp-sync').version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Cargo package version is not stable.'
          }

          $package = Join-Path $env:GITHUB_WORKSPACE "source-linux-source-assets/enjoyable-mcp-sync-$releaseVersion.crate"
          $packageRoot = Join-Path $env:RUNNER_TEMP 'mcp-sync-cargo-package'
          $installRoot = Join-Path $env:RUNNER_TEMP 'mcp-sync-cargo-install'
          New-Item -ItemType Directory -Path $packageRoot | Out-Null
          tar -xzf $package -C $packageRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not extract the exact Cargo package.'
          }
          cargo install `
            --path (Join-Path $packageRoot "enjoyable-mcp-sync-$releaseVersion") `
            --locked `
            --root $installRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not install the exact Cargo source package.'
          }
          & scripts/smoke-installed.ps1 `
            -Executable (Join-Path $installRoot 'bin/mcp-sync.exe') `
            -ExpectedVersion $releaseVersion

  payload:
    name: Verify the exact non-publishing source and GNU/Linux payload
    needs:
      - source
      - unix
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the stable package version
        id: version
        run: |
          set -euo pipefail
          release_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          printf 'version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"

      - name: Download every represented source and GNU/Linux payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: source-linux-preflight-*
          path: release-assets
          merge-multiple: true

      - name: Verify both prepublication and published payload contracts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/verify-source-linux-release-assets.sh release-assets "$RELEASE_VERSION"
          scripts/verify-published-source-linux-release.sh release-assets "$RELEASE_VERSION"

      - name: Retain the complete dry-run payload briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-linux-preflight-complete
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1
