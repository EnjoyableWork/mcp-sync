name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository policy gates
        run: |
          ./scripts/verify-workflow-supply-chain.sh
          ./scripts/verify-repository-artifacts.sh
          ./scripts/test-repository-artifact-policy.sh
          ./scripts/test-organization-access-policy.sh

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1; cargo-deny 0.20.2
        with:
          arguments: --all-features --locked

  quality:
    name: Linux ${{ matrix.architecture }} — format, Clippy, and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify the native GNU/Linux Rust host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "${actual_rust_host}" = "${EXPECTED_RUST_HOST}"

      - name: Run quality gates through a synthetic home
        run: ./scripts/check.sh

  windows-quality:
    name: Windows ${{ matrix.architecture }} — format, Clippy, and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
            rust_host: x86_64-pc-windows-msvc
          - architecture: ARM64
            runner: windows-11-arm
            rust_host: aarch64-pc-windows-msvc

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify the native Windows MSVC Rust host
        shell: pwsh
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          $actualRustHost = (rustc --version --verbose | Select-String '^host: ').Line.Substring(6)
          if ($actualRustHost -ne $env:EXPECTED_RUST_HOST) {
            throw "Expected Rust host $env:EXPECTED_RUST_HOST but found $actualRustHost"
          }

      - name: Run quality gates through a synthetic Windows home
        shell: pwsh
        run: ./scripts/check.ps1
