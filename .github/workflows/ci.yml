name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1; cargo-deny 0.20.2
        with:
          arguments: --all-features --locked

  quality:
    name: Linux ${{ matrix.architecture }} — format, Clippy, and test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
            rust_host: x86_64-unknown-linux-gnu
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            rust_host: aarch64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select the repository Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Verify the native GNU/Linux Rust host
        env:
          EXPECTED_RUST_HOST: ${{ matrix.rust_host }}
        run: |
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "${actual_rust_host}" = "${EXPECTED_RUST_HOST}"

      - name: Run quality gates through a synthetic home
        run: ./scripts/check.sh
