name: Publish source and GNU/Linux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix
        required: true
        default: 0.1.0
        type: string
      mode:
        description: Rehearse immutable v0.1.0 without writes, or publish a later source/GNU/Linux release
        required: true
        default: rehearse
        type: choice
        options:
          - rehearse
          - publish

permissions: {}

concurrency:
  group: mcp-sync-release
  cancel-in-progress: false

jobs:
  request:
    name: Validate the source release request before protected access
    if: >-
      github.repository == 'EnjoyableWork/mcp-sync' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.contract.outputs.version }}

    steps:
      - name: Require a canonical later version on its exact protected tag
        id: contract
        env:
          REQUEST_REF: ${{ github.ref }}
          REQUEST_REF_PROTECTED: ${{ github.ref_protected }}
          REQUEST_REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          stable_version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$REQUESTED_VERSION" =~ $stable_version_pattern ]] ||
            [[ "$REQUESTED_VERSION" == 0.0.* ]] ||
            [[ "$REQUESTED_VERSION" == 0.1.0 ]] ||
            [[ "$REQUEST_REF_TYPE" != tag ]] ||
            [[ "$REQUEST_REF" != "refs/tags/v$REQUESTED_VERSION" ]] ||
            [[ "$REQUEST_REF_PROTECTED" != true ]]; then
            echo "source and GNU/Linux publication requires a canonical later version on its exact protected tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$REQUESTED_VERSION" >>"$GITHUB_OUTPUT"

  validate:
    name: Validate protected source-linux-release authority
    needs: request
    if: >-
      github.repository == 'EnjoyableWork/mcp-sync' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      registry_version_exists: ${{ steps.contract.outputs.registry_version_exists }}

    steps:
      - name: Check out the protected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the tag, source, registry identity, and repository controls
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ needs.request.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] ||
            [[ "$PUBLICATION_MODE" != publish ]] ||
            [[ "$GITHUB_REF_TYPE" != tag ]] ||
            [[ "$GITHUB_REF" != "refs/tags/v$REQUESTED_VERSION" ]] ||
            [[ "$GITHUB_REF_PROTECTED" != true ]]; then
            echo "source and GNU/Linux publication requires an exact protected tag dispatch" >&2
            exit 1
          fi

          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "enjoyable-mcp-sync") | .version'
          )"
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]]; then
            echo "source and GNU/Linux releases require an intentional annotated tag" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "release tag must identify the current main commit" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "release tag does not resolve to the triggering commit" >&2
            exit 1
          fi

          authorization_url="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-authorize.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --event workflow_dispatch \
              --status completed \
              --limit 5 \
              --json headSha,conclusion,url \
              --jq "map(select(.headSha == \"$GITHUB_SHA\" and .conclusion == \"success\"))[0].url // empty"
          )"
          if [[ -z "$authorization_url" ]]; then
            echo "release has no successful protected authorization for this exact commit" >&2
            exit 1
          fi
          scripts/verify-public-stable-tag-ruleset.sh "$GITHUB_REPOSITORY"

          registry_response="$RUNNER_TEMP/enjoyable-mcp-sync-crates.json"
          registry_status="$(
            curl --silent --show-error --location --retry 5 \
              --proto '=https' --proto-redir '=https' --tlsv1.2 \
              --output "$registry_response" \
              --write-out '%{http_code}' \
              --header 'User-Agent: mcp-sync-source-linux-release/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
              'https://crates.io/api/v1/crates/enjoyable-mcp-sync'
          )"
          if [[ "$registry_status" != 200 ]]; then
            echo "repeat-release automation requires the existing enjoyable-mcp-sync crate" >&2
            exit 1
          fi
          jq -e '
            .crate.repository == "https://github.com/EnjoyableWork/mcp-sync" and
            .crate.trustpub_only == true and
            any(.versions[]; .num == "0.1.0" and .yanked == false) and
            all(.versions[];
              .num | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
          ' "$registry_response" >/dev/null
          mapfile -t published_stable_versions < <(
            jq -r '.versions[].num' "$registry_response"
          )
          if [[ ${#published_stable_versions[@]} -eq 0 ]]; then
            echo "crates.io has no stable enjoyable-mcp-sync baseline" >&2
            exit 1
          fi
          release_version="$(
            scripts/validate-release-version.sh \
              future \
              "$GITHUB_REF_NAME" \
              "$package_version" \
              "${published_stable_versions[@]}"
          )"
          if [[ "$release_version" != "$REQUESTED_VERSION" ]]; then
            echo "release input does not match the exact tag and Cargo package version" >&2
            exit 1
          fi
          release_notes="docs/releases/v$release_version.md"
          if [[ ! -f "$release_notes" || -L "$release_notes" ]]; then
            echo "release notes must exist as a regular file for the exact version" >&2
            exit 1
          fi

          registry_version_exists=false
          if jq -e \
            --arg version "$release_version" \
            'any(.versions[]; .num == $version)' \
            "$registry_response" >/dev/null; then
            jq -e \
              --arg version "$release_version" \
              'any(.versions[]; .num == $version and .yanked == false)' \
              "$registry_response" >/dev/null
            registry_version_exists=true
          fi

          existing_release="$RUNNER_TEMP/existing-source-linux-release.json"
          existing_release_immutable=false
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            >"$existing_release" 2>/dev/null; then
            jq -e \
              --arg tag "$GITHUB_REF_NAME" \
              '.tag_name == $tag and (.draft == true or .immutable == true)' \
              "$existing_release" >/dev/null
            existing_release_immutable="$(jq -r '.immutable' "$existing_release")"
          fi
          if [[ "$registry_version_exists" == true &&
            "$existing_release_immutable" != true ]]; then
            echo "an existing Cargo version is recoverable only from its immutable GitHub Release" >&2
            exit 1
          fi

          printf 'version=%s\n' "$release_version" >>"$GITHUB_OUTPUT"
          printf 'registry_version_exists=%s\n' "$registry_version_exists" >>"$GITHUB_OUTPUT"

  source:
    name: Package deterministic Cargo and Homebrew source outputs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package and verify deterministic source channels
        run: |
          set -euo pipefail
          cargo package --locked
          package="target/package/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          first_hash="$(sha256sum "$package" | awk '{ print $1 }')"
          cargo package --locked
          second_hash="$(sha256sum "$package" | awk '{ print $1 }')"
          test "$first_hash" = "$second_hash"

          scripts/generate-source-linux-release-channels.sh \
            "$package" \
            "$RELEASE_VERSION" \
            generated-source-linux-channels
          scripts/generate-source-linux-release-channels.sh \
            "$package" \
            "$RELEASE_VERSION" \
            generated-source-linux-channels-second
          diff -ru generated-source-linux-channels generated-source-linux-channels-second

          mkdir -p release-assets
          install -m 0644 \
            "generated-source-linux-channels/cargo/enjoyable-mcp-sync-$RELEASE_VERSION.crate" \
            release-assets/
          install -m 0644 \
            generated-source-linux-channels/homebrew/Formula/mcp-sync.rb \
            release-assets/

      - name: Attest the Cargo source package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/enjoyable-mcp-sync-${{ env.RELEASE_VERSION }}.crate

      - name: Attest the source-building Homebrew formula
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/mcp-sync.rb

      - name: Upload the source-channel payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-linux-release-source
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: GNU/Linux ${{ matrix.architecture }} — package and attest
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - architecture: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RUST_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the native GNU/Linux Rust host
        run: |
          set -euo pipefail
          actual_rust_host="$(rustc --version --verbose | sed -n 's/^host: //p')"
          test "$actual_rust_host" = "$RUST_TARGET"

      - name: Build the native release executable
        run: cargo build --release --locked

      - name: Package and smoke-test the archive
        id: package
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive_path="$(
            scripts/package-release.sh \
              "$RELEASE_VERSION" \
              "$RUST_TARGET" \
              target/release/mcp-sync \
              release-assets
          )"
          scripts/smoke-archive.sh "$archive_path" "$RELEASE_VERSION"
          printf 'archive=%s\n' "$(basename "$archive_path")" >>"$GITHUB_OUTPUT"

      - name: Generate the target SPDX SBOM
        env:
          ARCHIVE_PATH: release-assets/${{ steps.package.outputs.archive }}
          SBOM_PATH: release-assets/mcp-sync-v${{ env.RELEASE_VERSION }}-${{ matrix.rust_target }}.spdx.json
        run: scripts/generate-sbom.sh "$ARCHIVE_PATH" "$SBOM_PATH"

      - name: Validate the target SPDX SBOM
        env:
          SBOM_PATH: release-assets/mcp-sync-v${{ env.RELEASE_VERSION }}-${{ matrix.rust_target }}.spdx.json
        run: |
          jq -e '
            .spdxVersion == "SPDX-2.3" and
            (.documentNamespace | type == "string") and
            (.packages | type == "array" and length > 0)
          ' "$SBOM_PATH" >/dev/null

      - name: Attest the GNU/Linux archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/${{ steps.package.outputs.archive }}

      - name: Attest the target SPDX SBOM
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/mcp-sync-v${{ env.RELEASE_VERSION }}-${{ matrix.rust_target }}.spdx.json

      - name: Upload the GNU/Linux release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-linux-release-${{ matrix.rust_target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify the source and GNU/Linux payload and publish immutably
    needs:
      - validate
      - source
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: release
      url: https://github.com/EnjoyableWork/mcp-sync/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out source-linux-release verification sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the complete source-linux-release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: source-linux-release-*
          path: release-assets
          merge-multiple: true

      - name: Require the exact payload and create SHA256SUMS
        run: scripts/verify-source-linux-release-assets.sh release-assets "$RELEASE_VERSION"

      - name: Attest the checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Verify every source and GNU/Linux build-provenance attestation
        run: |
          set -euo pipefail
          for release_asset in release-assets/*; do
            gh attestation verify "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/source-linux-release.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --format json >/dev/null
          done

      - name: Create or repair the draft source and GNU/Linux release
        id: draft
        run: |
          set -euo pipefail
          release_state="$RUNNER_TEMP/source-linux-release-state.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            >"$release_state" 2>/dev/null; then
            if [[ "$(jq -r '.immutable' "$release_state")" == true ]]; then
              printf 'already_immutable=true\n' >>"$GITHUB_OUTPUT"
            elif [[ "$(jq -r '.draft' "$release_state")" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --title "mcp-sync v$RELEASE_VERSION" \
                --notes-file "docs/releases/v$RELEASE_VERSION.md"
              gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
              printf 'already_immutable=false\n' >>"$GITHUB_OUTPUT"
            else
              echo "existing source and GNU/Linux release is published without immutability" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --draft \
              --verify-tag \
              --title "mcp-sync v$RELEASE_VERSION" \
              --notes-file "docs/releases/v$RELEASE_VERSION.md"
            printf 'already_immutable=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Verify the exact draft payload bytes
        run: |
          set -euo pipefail
          mkdir -p draft-download
          gh release download "$GITHUB_REF_NAME" --dir draft-download
          scripts/verify-published-source-linux-release.sh draft-download "$RELEASE_VERSION"
          for release_asset in release-assets/*; do
            cmp --silent "$release_asset" "draft-download/$(basename "$release_asset")"
          done

      - name: Publish the verified draft
        if: steps.draft.outputs.already_immutable != 'true'
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Require immutable release state and release attestation
        run: |
          set -euo pipefail
          immutable=false
          for _ in {1..60}; do
            immutable="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                --jq '.immutable'
            )"
            if [[ "$immutable" == true ]] &&
              gh release verify "$GITHUB_REF_NAME" --format json >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          if [[ "$immutable" != true ]]; then
            echo "published source and GNU/Linux release did not become immutable" >&2
            exit 1
          fi
          gh release verify "$GITHUB_REF_NAME" --format json >/dev/null

      - name: Re-download and verify the immutable source and GNU/Linux release
        run: |
          set -euo pipefail
          mkdir -p immutable-download
          gh release download "$GITHUB_REF_NAME" --dir immutable-download
          scripts/verify-published-source-linux-release.sh immutable-download "$RELEASE_VERSION"
          for release_asset in release-assets/*; do
            cmp --silent "$release_asset" "immutable-download/$(basename "$release_asset")"
          done

      - name: Require exact registry recovery bytes when the Cargo version already exists
        if: needs.validate.outputs.registry_version_exists == 'true'
        run: |
          set -euo pipefail
          registry_package="$RUNNER_TEMP/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$registry_package" \
            --header 'User-Agent: mcp-sync-source-linux-release/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
            "https://crates.io/api/v1/crates/enjoyable-mcp-sync/$RELEASE_VERSION/download"
          cmp --silent \
            "immutable-download/enjoyable-mcp-sync-$RELEASE_VERSION.crate" \
            "$registry_package"

  rehearse:
    name: Rehearse immutable source and downstream byte handoffs
    if: >-
      github.repository == 'EnjoyableWork/mcp-sync' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'rehearse'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read

    steps:
      - name: Check out the controlled default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restrict the live rehearsal to immutable v0.1.0 from exact main
        id: contract
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current_main="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              --jq '.object.sha'
          )"
          if [[ "$GITHUB_REF" != refs/heads/main ||
            "$GITHUB_REF_PROTECTED" != true ||
            "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ||
            "$current_main" != "$GITHUB_SHA" ]]; then
            echo "the live repeat-release rehearsal must use exact protected main" >&2
            exit 1
          fi
          rehearsal_version="$(
            scripts/validate-release-version.sh \
              rehearsal \
              "v$REHEARSAL_VERSION" \
              "$REHEARSAL_VERSION"
          )"
          printf 'version=%s\n' "$rehearsal_version" >>"$GITHUB_OUTPUT"

      - name: Verify the real immutable release and every public source handoff
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          release_tag="v$RELEASE_VERSION"
          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          test "$(git cat-file -t "$release_tag")" = tag
          release_commit="$(git rev-parse "$release_tag^{commit}")"

          release_state="$RUNNER_TEMP/rehearsal-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" \
            -H 'X-GitHub-Api-Version: 2026-03-10' >"$release_state"
          jq -e \
            --arg tag "$release_tag" \
            '.tag_name == $tag and .draft == false and
             .prerelease == false and .immutable == true' \
            "$release_state" >/dev/null

          release_assets="$RUNNER_TEMP/rehearsal-release-assets"
          public_handoffs="$RUNNER_TEMP/rehearsal-public-handoffs"
          mkdir -p "$release_assets" "$public_handoffs"
          gh release download "$release_tag" --dir "$release_assets"
          scripts/verify-published-source-linux-release.sh \
            "$release_assets" \
            "$RELEASE_VERSION"
          gh release verify "$release_tag" --format json >/dev/null
          for release_asset in "$release_assets"/*; do
            gh attestation verify "$release_asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/source-linux-release.yml" \
              --source-ref "refs/tags/$release_tag" \
              --source-digest "$release_commit" \
              --format json >/dev/null
          done

          registry_package="$public_handoffs/enjoyable-mcp-sync-$RELEASE_VERSION.crate"
          published_formula="$public_handoffs/mcp-sync.rb"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$registry_package" \
            --header 'User-Agent: mcp-sync-release-rehearsal/0.1 (+https://github.com/EnjoyableWork/mcp-sync)' \
            "https://crates.io/api/v1/crates/enjoyable-mcp-sync/$RELEASE_VERSION/download"
          curl --fail --silent --show-error --location --retry 5 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$published_formula" \
            'https://raw.githubusercontent.com/EnjoyableWork/homebrew-tap/main/Formula/mcp-sync.rb'
          cmp --silent \
            "$release_assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate" \
            "$registry_package"
          cmp --silent "$release_assets/mcp-sync.rb" "$published_formula"

          mismatched_package="$RUNNER_TEMP/mismatched-enjoyable-mcp-sync.crate"
          mismatched_formula="$RUNNER_TEMP/mismatched-mcp-sync.rb"
          cp "$registry_package" "$mismatched_package"
          cp "$published_formula" "$mismatched_formula"
          printf '\n' >>"$mismatched_package"
          printf '\n' >>"$mismatched_formula"
          if cmp --silent \
            "$release_assets/enjoyable-mcp-sync-$RELEASE_VERSION.crate" \
            "$mismatched_package"; then
            echo "the rehearsal accepted a mismatched Cargo handoff" >&2
            exit 1
          fi
          if cmp --silent "$release_assets/mcp-sync.rb" "$mismatched_formula"; then
            echo "the rehearsal accepted a mismatched Homebrew handoff" >&2
            exit 1
          fi

          scripts/test-release-version-policy.sh

      - name: Record the nonpublishing repeat-release rehearsal
        env:
          RELEASE_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          {
            echo '## Repeat-release rehearsal'
            echo
            echo "- Reused immutable release: \`v$RELEASE_VERSION\`"
            echo '- GitHub, crates.io, and Homebrew bytes: exact'
