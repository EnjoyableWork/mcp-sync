[package]
name = "enjoyable-mcp-sync"
version = "0.1.0"
edition = "2024"
description = "Synchronize local Model Context Protocol server configurations"
license = "MIT"
repository = "https://github.com/EnjoyableWork/mcp-sync"
homepage = "https://github.com/EnjoyableWork/mcp-sync"
readme = "README.md"
keywords = ["mcp", "configuration", "cli", "developer-tools"]
categories = ["command-line-utilities", "config"]
publish = ["crates-io"]
include = [
    "/.github/workflows/cargo-publish.yml",
    "/.github/workflows/release*.yml",
    "/.github/workflows/source-linux-release*.yml",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/scripts/**",
    "/docs/source-linux-release.md",
    "/docs/release.md",
    "/docs/releases/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[[bin]]
name = "mcp-sync"
path = "src/main.rs"

[[test]]
name = "health_process_containment"
path = "tests/health_process_containment.rs"
harness = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["cst", "serde_json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
