[package]
name = "enjoyable-mcp-sync"
version = "0.1.0"
edition = "2024"
description = "Synchronize local Model Context Protocol server configurations"
license = "MIT"
repository = "https://github.com/EnjoyableWork/mcp-sync"
readme = "README.md"

[[bin]]
name = "mcp-sync"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
