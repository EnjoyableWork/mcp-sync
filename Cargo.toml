[package]
name = "enjoyable-mcp-sync"
version = "0.1.0"
edition = "2024"
description = "Synchronize local Model Context Protocol server configurations"
license = "MIT"
repository = "https://github.com/EnjoyableWork/mcp-sync"
homepage = "https://github.com/EnjoyableWork/mcp-sync"
readme = "README.md"
keywords = ["mcp", "configuration", "cli", "developer-tools"]
categories = ["command-line-utilities", "config"]
publish = ["crates-io"]
include = [
    "/.github/workflows/release*.yml",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/scripts/**",
    "/docs/release.md",
    "/docs/releases/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[[bin]]
name = "mcp-sync"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
tempfile = "3.27.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["display", "parse"] }

[dev-dependencies]
assert_cmd = "2.2.2"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
